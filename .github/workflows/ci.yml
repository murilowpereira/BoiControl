name: Testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Cálculos e interface
        run: npm test
      - name: Regras de segurança e operações (emulador)
        run: npm run test:rules
      - name: Backup e restauração (emulador)
        run: npm run test:backup
      - name: Build do app
        run: npm run build -w @boicontrol/web
